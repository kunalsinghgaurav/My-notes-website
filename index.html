<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Pro Notepad</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>📝 My Notepad</h2>
        <button id="newNoteBtn" class="primary-btn">+ New Note</button>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search notes...">
      </div>

      <div class="notes-list" id="notesList">
        <!-- Notes list yahan dynamically render hogi -->
      </div>

      <div class="sidebar-footer">
        <div class="auth-status-bar" style="margin-bottom: 10px; font-size: 13px;">
          <span id="syncStatus">☁️ Offline</span>
        </div>
        <button id="openAuthModalBtn" class="secondary-btn" style="width: 100%; margin-bottom: 8px;">👤 Account / Login</button>
        <button id="logoutBtn" class="danger-btn" style="width: 100%; display: none; margin-bottom: 8px;">Log Out</button>

        <div class="backup-tools" style="display: flex; gap: 6px;">
          <button id="backupBtn" class="small-btn" style="flex: 1;">Backup</button>
          <label class="small-btn" style="flex: 1; text-align: center; cursor: pointer;">
            Restore
            <input type="file" id="restoreInput" accept=".json" style="display: none;">
          </label>
        </div>
      </div>
    </aside>

    <main class="editor-area">
      <div class="editor-toolbar">
        <input type="text" id="noteTitle" placeholder="Untitled Note" class="note-title-input">
        <div class="toolbar-actions">
          <button id="deleteNoteBtn" class="icon-btn" title="Delete Note">🗑️</button>
        </div>
      </div>
      <div id="noteBody" class="note-body-editor" contenteditable="true" placeholder="Start typing your note here..."></div>
    </main>
  </div>

  <!-- AUTH POPUP MODAL -->
  <div id="authModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Cloud Account</h3>
        <button id="closeAuthModalBtn" class="close-x">&times;</button>
      </div>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Notes cloud par sync karne ke liye login ya sign up karein</p>
      
      <div class="form-group" style="margin-bottom: 12px;">
        <input type="email" id="authEmail" placeholder="Email address" class="modal-input" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <input type="password" id="authPassword" placeholder="Password" class="modal-input" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
      </div>

      <div style="display: flex; gap: 10px;">
        <button id="authLoginBtn" class="primary-btn" style="flex: 1; padding: 10px;">Log In</button>
        <button id="authSignUpBtn" class="secondary-btn" style="flex: 1; padding: 10px;">Sign Up</button>
      </div>

      <!-- FORGOT PASSWORD LINK -->
      <div style="text-align: center; margin-top: 14px;">
        <a href="#" id="forgotPasswordBtn" style="color: #6366f1; font-size: 13px; text-decoration: underline; cursor: pointer;">Forgot Password?</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
